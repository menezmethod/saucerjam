name: Bug report
description: Report a reproducible problem in the released game.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For ideas, balance, art, or general discussion, use [GitHub Discussions](https://github.com/menezmethod/saucerjam/discussions) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Join ...
        3. Press ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version or commit
      placeholder: "1.3.0 or abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS, and browser
      placeholder: "iPhone 15, iOS 18, Safari 18"
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Map and mode
      placeholder: "Confluence / online"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, a short video, console errors, or a public reproduction link. Do not include tokens or private data.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed authentication tokens, personal data, and private gameplay data.
          required: true
        - label: I searched existing issues and discussions for duplicates.
          required: true
