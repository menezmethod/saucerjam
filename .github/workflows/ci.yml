name: Verify game
# One run per commit. `push` for every branch plus `pull_request` ran the full
# suite twice for the same commit (a branch push and its pull request share a
# SHA), and this workflow drives two or more software-WebGL Chromium instances
# through the browser suite — so the duplicate ran two such suites against the
# same runner pool at the same time and starved both.
#
# Non-default-branch work still gets verified: every commit reaches the suite
# through its pull request, and `main` is verified on merge.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
