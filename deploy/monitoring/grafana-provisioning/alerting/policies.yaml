# Grafana alerting provisioning: root notification policy -> grafana-hermes.
# Repo mirror of:
#   /home/menez/docker/prometheus/grafana/provisioning/alerting/policies.yaml
# This replaces the previous root receiver (Telegram Alerts).
apiVersion: 1
policies:
  - orgId: 1
    receiver: grafana-hermes
    group_by:
      - alertname
      - job
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
