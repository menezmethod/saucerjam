# Prometheus alert rules for SaucerJam. Loaded via rule_files in prometheus.yml.
# Every alert matches the Grafana -> Hermes "grafana-alerts" webhook contract
# (see deploy/monitoring/grafana-alerts-contact-point.md and docs/SRE.md).
groups:
  - name: saucerjam-availability
    interval: 30s
    rules:
      - alert: SaucerJamDown
        expr: up{job="saucerjam"} == 0
        for: 2m
        labels:
          severity: critical
          service: saucerjam
        annotations:
          summary: "SaucerJam is unreachable"
          description: "Prometheus has failed to scrape qd.menezmethod.com/metrics for 2m."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-saucerjamdown"

      - alert: SaucerJamHealthDegraded
        expr: saucerjam_rankings_status{status="degraded"} == 1
        for: 5m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "SaucerJam rankings persistence is degraded"
          description: "Round results are failing to persist; leaderboard may be stale."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-rankingsdegraded"

  - name: saucerjam-capacity
    interval: 30s
    rules:
      - alert: SaucerJamRoomsSaturated
        expr: saucerjam_rooms >= 8
        for: 5m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "All SaucerJam rooms are in use"
          description: "New 'Play online' joins will be rejected with 'All arenas are busy'."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-roomssaturated"

      - alert: SaucerJamJoinFailureSpike
        expr: sum(rate(saucerjam_join_failures_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "Elevated join failures"
          description: "More than 0.5 join rejections/sec for 5m; check the reason label."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-joinfailures"

      - alert: SaucerJamManyHumansPerRoom
        expr: saucerjam_players / clamp_min(saucerjam_rooms, 1) > 24
        for: 5m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "High pilots per room"
          description: "Average pilots/room exceeds 24 (MAX_ROOM_PLAYERS default 32); verify host headroom."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-capacity"

  - name: saucerjam-runtime
    interval: 30s
    rules:
      - alert: SaucerJamMemoryHigh
        expr: saucerjam_process_resident_memory_bytes > 384 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "SaucerJam memory above 384 MiB"
          description: "Container is provisioned at 512 MiB; investigate a leak or room accumulation."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-memory"

      - alert: SaucerJamRankingSaveErrors
        expr: increase(saucerjam_ranking_save_errors_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "SaucerJam failed to persist a round"
          description: "ranking save errors incremented; check RANKINGS_FILE volume and permissions."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-rankingsdegraded"

      - alert: SaucerJamRateLimitStorm
        expr: sum(rate(saucerjam_rate_limited_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "Rate limiter rejecting aggressively"
          description: "Possible abuse or a broken client loop; inspect route label."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#runbook-ratelimit"

  - name: saucerjam-insights
    interval: 30s
    rules:
      - alert: SaucerJamPlayersStuck
        expr: insight_friction_ratio{signal="stuck_no_input_per_session"} > 0.15
        for: 30m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "New pilots are joining but not playing"
          description: "Share of sessions stuck in the lobby without input above 0.15 for 30m; onboarding or control-binding problem, not automatically fixable."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE-INSIGHTS.md"

  # The community loop is silent when healthy, so a silent failure looks exactly
  # like a healthy one. This is the one counter that distinguishes them.
  # NOTE: a webhook that Fider has disabled cannot be seen from here — no
  # delivery means no metric. Fider disables a webhook permanently on the first
  # non-2xx and never retries, so detecting that needs an active comparison of
  # Fider's post list against the queue (the collector already fetches every
  # post hourly), not a counter. That reconciliation is still open.
  - name: saucerjam-community
    interval: 60s
    rules:
      - alert: SaucerJamWebhookRejecting
        # degraded_parse: the tolerant parser salvaged the delivery and the item
        # WAS queued, so it is template drift, not a lost report.
        # disallowed_action: incremented by POST /api/community/action on the
        # Hermes side, not by a webhook delivery at all — no report is involved,
        # so it does not belong in a rule about deliveries being lost.
        expr: increase(saucerjam_community_webhook_rejected_total{reason!~"degraded_parse|disallowed_action"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
          service: saucerjam
        annotations:
          summary: "Fider webhook deliveries are being rejected or dropped"
          description: "Check the reason label. bad_credential = the presented signature/token did not verify. NOTE: this endpoint is published, so routine internet scanning reaches it unauthenticated and will trip this alone — before rotating anything, check whether deliveries are still arriving, because a healthy loop plus scanner noise looks identical here. unusable_item = the body template drifted so the title is empty, so the report was DROPPED; body_rejected = a post larger than the body cap, dropped; body_error = the body could not be read (a client that dropped mid-upload lands here), dropped; rate_limited = over the webhook meter, dropped; verification_error = an internal fault in credential checking. Each of those means a report did not reach the queue. degraded_parse and disallowed_action are deliberately EXCLUDED from this expression: see the comment on the expr."
          runbook_url: "https://github.com/menezmethod/saucerjam/blob/main/docs/SRE.md#6-community--ai-pipeline"

